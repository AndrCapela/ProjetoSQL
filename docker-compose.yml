services:
  sql-arena:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sql-arena
    restart: unless-stopped
    # Escuta apenas em localhost (127.0.0.1) para ficar protegido atrás do Nginx/Caddy (nip.io + HTTPS).
    # Se quiser acessar direto via http://SEU_IP.nip.io:7500 sem proxy reverso, troque para "7500:7500".
    ports:
      - "127.0.0.1:7500:7500"
    environment:
      APP_ENV: ${APP_ENV:-production}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      CHAT_RATE_LIMIT_PER_MINUTE: ${CHAT_RATE_LIMIT_PER_MINUTE:-6}
      CHAT_DAILY_LIMIT_PER_USER: ${CHAT_DAILY_LIMIT_PER_USER:-20}
      CHAT_MAX_HISTORY_MESSAGES: ${CHAT_MAX_HISTORY_MESSAGES:-6}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-3.5-flash,gemini-2.5-flash-lite,gemini-2.5-flash}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-minimal}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-450}
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
